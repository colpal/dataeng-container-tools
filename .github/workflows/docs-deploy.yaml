name: Build and Deploy Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
    tags:
      - 'v*.*.*'

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy-version:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Determine version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" =~ (alpha|beta|rc|dev|pre) ]]; then
            echo "alias=" >> $GITHUB_OUTPUT
          else
            echo "alias=latest" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Deploy versioned docs
        run: |
          if [[ -n "$ALIAS" ]]; then
            uv run mike deploy --push --update-aliases --alias-type redirect "$VERSION" "$ALIAS"
            uv run mike set-default --push latest
          else
            uv run mike deploy --push "$VERSION"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ALIAS: ${{ steps.version.outputs.alias }}

  deploy-dev:
    needs: [deploy-version]
    if: always() && !startsWith(github.ref, 'refs/tags/') && (needs.deploy-version.result == 'success' || needs.deploy-version.result == 'skipped')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Deploy dev docs
        run: uv run mike deploy --push dev

  sync-to-gcs:
    needs: [deploy-version, deploy-dev]
    if: |
      always() &&
      (needs.deploy-version.result == 'success' || needs.deploy-version.result == 'skipped') &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'failure' || needs.deploy-dev.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: gh-pages
          clean: true

      - name: Google Auth
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.CR_PROJECT }}
          workload_identity_provider: ${{ secrets.WI_PROVIDER }}

      - name: Setup gcloud
        id: setup-gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Sync gh-pages to GCS
        run: |
          gsutil -m rsync -r -d -x '.git/.*|gha-creds-.*\.json' . gs://${{ secrets.CR_BUCKET }}/
          gsutil -m setmeta -h "Cache-Control:public, max-age=3600" gs://${{ secrets.CR_BUCKET }}/**
