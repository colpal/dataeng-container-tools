[project]
name = "dataeng-container-tools"
dynamic = ["version"]
description = "A package containing tools for data engineering containers."
readme = "README.md"
maintainers = [
    { name = "CP DE Team", email = "git_data_science_engineering@colpal.com" },
]
requires-python = ">=3.10"
license = { text = "MIT License" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "psutil>=7.2.2",
    "pyarrow>=24.0.0",
    "pandas>=2.3.3",
    "google-cloud-storage>=3.4.1",
    "cryptography>=48.0.0",
]

[project.optional-dependencies]
datastore = ["google-cloud-datastore>=2.21.0"]
snowflake = ["snowflake-connector-python>=4.6.0"]
polars = ["polars[excel]>=1.41.2"]
excel = ["pandas[excel]>=2.3.3"]

[project.urls]
homepage = "https://github.com/colpal/dataEng-container-tools"
download = "https://github.com/colpal/dataEng-container-tools/releases"
tracker = "https://github.com/colpal/dataEng-container-tools/issues"

[dependency-groups]
dev = [
    # Self
    "dataeng-container-tools[datastore,snowflake,polars,excel]",
    # Linting
    "ruff==0.15.15",
    "prek==0.4.4",
    # Type stubs
    "types-setuptools",
    "types-psutil==7.2.2.20260518",
    "types-requests==2.31.0.6",
    "pandas-stubs==2.3.3.260113",
    # Test
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "requests-mock==1.12.1",
    "fakesnow[server]==0.11.7",
    "googleapis-storage-testbench @ git+https://github.com/googleapis/storage-testbench@6f9cf7a8c9d41269bbf8c423cf9b68ec8bf8bc06", # v0.62.0 No official pip package yet
    # Docs
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
    "mkdocstrings[python]==1.0.3",
    "mkdocs-gen-files==0.6.0",
    "mkdocs-literate-nav==0.6.2",
    "mkdocs-section-index==0.3.10",
    "mike==2.1.4",
]

[build-system]
requires = ["setuptools>=42", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dataeng_container_tools"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
exclude = [".git", ".vscode", ".venv", "__pycache__", ".eggs", "build", "dist"]
# Disable `typing_extensions` imports. Causes issues in Python 3.10
typing-extensions = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 15
max-branches = 20
max-statements = 75
max-returns = 15

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    # https://github.com/astral-sh/ruff/issues/4368
    "S101", # asserts allowed in tests...
    "ARG",  # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",  # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # The below are debateable
    "PLR2004", # Magic value used in comparison, ...
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes

    # Others
    "S603",   # Subprocess
    "SLF001", # Private member access
]
"dataeng_container_tools/**/*.py" = [
    "PLC0415", # import-outside-top-level
]
"docs/**/*.py" = [
    "INP001", # Implicit namespace package
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
